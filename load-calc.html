<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор нагрузки обзвона</title>
<style>
/* Токены в духе Ant Design 5 */
:root{
  --primary:#1677ff; --primary-hover:#4096ff; --primary-active:#0958d9; --primary-bg:#e6f4ff; --primary-border:#91caff;
  --text:rgba(0,0,0,.88); --text2:rgba(0,0,0,.65); --text3:rgba(0,0,0,.45);
  --border:#d9d9d9; --split:#f0f0f0; --bg:#f5f5f5; --fill:rgba(0,0,0,.02); --fill-hover:rgba(0,0,0,.06);
  --danger:#ff4d4f; --danger-hover:#ff7875; --danger-bg:#fff2f0;
  --shadow:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5715 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif}
input,button{font:inherit;color:inherit}

/* Layout */
.header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--split);height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px}
.header h1{margin:0;font-size:18px;font-weight:600}
.content{max-width:1280px;margin:0 auto;padding:24px}
.list{display:flex;flex-direction:column;gap:24px}

/* Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:4px 15px;border-radius:6px;border:1px solid var(--border);background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.02);cursor:pointer;white-space:nowrap;transition:all .2s cubic-bezier(.645,.045,.355,1)}
.btn:hover{color:var(--primary-hover);border-color:var(--primary-hover)}
.btn:active{color:var(--primary-active);border-color:var(--primary-active)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 0 rgba(5,145,255,.1)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-primary:active{background:var(--primary-active);border-color:var(--primary-active);color:#fff}
.btn-text{border-color:transparent;background:transparent;box-shadow:none;padding:4px 8px}
.btn-text:hover{background:var(--fill-hover);border-color:transparent;color:var(--text)}
.btn-text.btn-danger{color:var(--danger)}
.btn-text.btn-danger:hover{background:var(--danger-bg);color:var(--danger)}
.btn-danger.armed{background:var(--danger);color:#fff}
.btn-danger.armed:hover{background:var(--danger-hover);color:#fff}
.btn-dashed{border-style:dashed;width:100%;height:40px;color:var(--text2)}
.btn .ic{font-size:16px;line-height:1}

/* Card */
.card{background:#fff;border-radius:8px;box-shadow:var(--shadow);border:1px solid var(--split)}
.card-head{min-height:56px;padding:0 16px 0 24px;border-bottom:1px solid var(--split);display:flex;align-items:center;gap:12px}
.title-input{flex:1;min-width:0;font-size:16px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:4px 8px;margin-left:-9px;background:transparent;outline:none;transition:all .2s}
.title-input:hover{border-color:var(--border)}
.title-input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(5,145,255,.1)}
.head-actions{display:flex;gap:4px}
.card-body{padding:24px}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:32px}

/* Divider с заголовком слева */
.divider{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-weight:600;font-size:15px}
.divider::after{content:"";flex:1;border-top:1px solid var(--split)}
.divider.mt{margin-top:28px}

/* Form */
.form-item{margin-bottom:16px}
.form-item label{display:block;padding-bottom:6px}
.input-number{display:flex;align-items:stretch;height:32px;border:1px solid var(--border);border-radius:6px;background:#fff;transition:all .2s}
.input-number:hover{border-color:var(--primary-hover)}
.input-number:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px rgba(5,145,255,.1)}
.input-number input{flex:1;min-width:0;border:none;outline:none;background:transparent;padding:4px 11px;font-variant-numeric:tabular-nums}
.input-number .addon{display:flex;align-items:center;padding:0 11px;background:var(--fill);border-left:1px solid var(--border);border-radius:0 6px 6px 0;color:var(--text2);white-space:nowrap}
.form-item.linked .input-number{border-color:var(--primary-border);background:var(--primary-bg)}
.form-item.linked .input-number:hover,.form-item.linked .input-number:focus-within{border-color:var(--primary)}
.form-item.linked .addon{background:transparent;border-left-color:var(--primary-border)}
.extra{color:var(--text3);margin-top:4px;font-size:13px;line-height:1.4}
.link-mark{color:var(--primary);margin-right:4px}

/* Statistic */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stats.s5{grid-template-columns:repeat(5,minmax(0,1fr))}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{padding:12px 16px;border:1px solid var(--split);border-radius:8px}
.stat-title{color:var(--text3);margin-bottom:4px;font-size:13px}
.stat-value{font-size:24px;line-height:32px;font-variant-numeric:tabular-nums}
.stat-value small{font-size:14px;color:var(--text3);margin-left:4px}
.tag{display:inline-block;margin-top:6px;font-size:12px;line-height:20px;padding:0 7px;border-radius:4px;border:1px solid var(--primary-border);background:var(--primary-bg);color:var(--primary-active);white-space:nowrap}

/* Table (bordered, middle) */
.tbl{overflow-x:auto;border:1px solid var(--split);border-radius:8px}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:10px 12px;border-bottom:1px solid var(--split);border-right:1px solid var(--split);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:last-child,td:last-child{border-right:none}
tbody tr:last-child td{border-bottom:none}
th{background:#fafafa;font-weight:600}
th.l,td.l{text-align:left}
tbody tr:hover td{background:#fafafa}
td.l{font-weight:500}

.empty{text-align:center;color:var(--text3);padding:48px 0}

/* Пароль */
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.lock form{background:#fff;border-radius:8px;box-shadow:var(--shadow);padding:32px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px}
.lock h2{margin:0;font-size:18px;font-weight:600}
.lock .input-number input{height:30px}
/* type="text" + маскирование: у type="password" macOS принудительно включает латиницу */
#pwd{-webkit-text-security:disc;text-security:disc}
.lock .err{color:var(--danger);min-height:22px;margin-top:-8px}

@media (max-width:1000px){
  .grid{grid-template-columns:1fr}
  .stats.s5{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:640px){
  .header{padding:0 16px}
  .content{padding:16px}
  .card-body{padding:16px}
  .stats,.stats.s5,.stats.s3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="lock" id="lock">
  <form id="lockForm">
    <h2>Калькулятор нагрузки обзвона</h2>
    <div class="input-number"><input id="pwd" type="text" placeholder="Пароль" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus></div>
    <button class="btn btn-primary" type="submit">Войти</button>
    <div class="err" id="pwdErr"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="header">
    <h1>Калькулятор нагрузки обзвона</h1>
    <button class="btn btn-primary" data-act="add"><span class="ic">+</span>Добавить расчёт</button>
  </header>
  <main class="content">
    <div class="list" id="list"></div>
    <button class="btn btn-dashed" data-act="add" style="margin-top:24px"><span class="ic">+</span>Добавить расчёт</button>
  </main>
</div>

<script>
const LS = 'load_calc_v2';
const DEF = { calls: 2000, mio: 30, cycle: 324, dz: 61.15, conv: 53.15, refuse: 48.05, ivr: 18, hours: 10, days: 21 };
const FIELDS = [
  { k: 'calls', label: 'Объём звонков', addon: 'шт', step: 1 },
  { k: 'mio', label: 'Портов МИО', addon: 'шт', step: 1, linked: 1 },
  { k: 'cycle', label: 'Цикл попытки на МИО', addon: 'сек', step: 1, extra: 'Сколько в среднем порт МИО занят одной попыткой' },
  { k: 'dz', label: 'Дозвоны', addon: '% от звонков', step: 0.01 },
  { k: 'conv', label: 'Разговоры', addon: '% от дозвонов', step: 0.01 },
  { k: 'refuse', label: 'Отказы', addon: '% от разговоров', step: 0.01 },
  { k: 'ivr', label: 'Портов IVR / потоков GigaVoice', addon: 'шт', step: 1, linked: 1, extra: 'Связано с портами МИО: IVR = МИО × % дозвонов.' },
  { k: 'hours', label: 'Часы обзвона в день', addon: 'ч', step: 0.5 },
  { k: 'days', label: 'Рабочих дней в месяц', addon: 'дн', step: 1 },
];
const NUM_KEYS = FIELDS.map(f => f.k);

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const nfCache = {};
function fmt(v, d = 0) {
  if (!isFinite(v)) return '—';
  const nf = nfCache[d] || (nfCache[d] = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d }));
  return nf.format(v);
}
const pct = v => isFinite(v) ? new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(v) + '%' : '—';

let state = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS));
    if (s && Array.isArray(s.items) && s.items.length) return s;
  } catch (e) { }
  return { items: [newItem(1)] };
}
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) { } }
function newItem(n) { return Object.assign({ id: uid(), name: `Расчёт ${n}` }, DEF); }
const byId = id => state.items.find(x => x.id === id);

// ---------- Расчёт ----------
function calc(e) {
  const d = e.dz / 100, c = e.conv / 100, r = e.refuse / 100;
  const aph = 3600 / e.cycle;                         // попыток на порт МИО в час
  const one = { att: aph, dz: aph * d, conv: aph * d * c };
  one.ref = one.conv * r;
  const scale = (o, m) => ({ att: o.att * m, dz: o.dz * m, conv: o.conv * m, ref: o.ref * m });
  const oneDay = scale(one, e.hours);
  const allH = scale(one, e.mio), allD = scale(oneDay, e.mio), allM = scale(allD, e.days);
  const hours = e.calls * e.cycle / e.mio / 3600;
  return {
    funnel: { calls: e.calls, dz: e.calls * d, conv: e.calls * d * c, ref: e.calls * d * c * r },
    one, oneDay, allH, allD, allM,
    ivr: { ports: e.ivr, dzH: allH.dz, perPort: allH.dz / e.ivr, convD: allD.conv, convM: allM.conv },
    total: { hours, days: hours / e.hours, months: hours / e.hours / e.days },
  };
}

const stat = (title, value, d = 0, tag = '', unit = '') =>
  `<div class="stat"><div class="stat-title">${title}</div><div class="stat-value">${fmt(value, d)}${unit ? `<small>${unit}</small>` : ''}</div>${tag ? `<span class="tag">${tag}</span>` : ''}</div>`;

function resultHTML(e) {
  const R = calc(e);
  const rows = [['Попытки', 'att'], ['Дозвоны', 'dz'], ['Разговоры', 'conv'], ['Отказы', 'ref']];
  return `
    <div class="stats">
      ${stat('Звонки', R.funnel.calls)}
      ${stat('Дозвоны', R.funnel.dz, 0, `${pct(e.dz)} от звонков`)}
      ${stat('Разговоры', R.funnel.conv, 0, `${pct(e.conv)} от дозвонов`)}
      ${stat('Отказы', R.funnel.ref, 0, `${pct(e.refuse)} от разговоров`)}
    </div>

    <div class="divider mt">Пропускная способность МИО</div>
    <div class="tbl"><table>
      <thead>
        <tr><th class="l" rowspan="2"></th><th colspan="2">1 порт МИО</th><th colspan="3">Все порты МИО (${fmt(e.mio)})</th></tr>
        <tr><th>в час</th><th>в день</th><th>в час</th><th>в день</th><th>в месяц</th></tr>
      </thead>
      <tbody>${rows.map(([l, k]) => `<tr><td class="l">${l}</td><td>${fmt(R.one[k], 1)}</td><td>${fmt(R.oneDay[k])}</td><td>${fmt(R.allH[k])}</td><td>${fmt(R.allD[k])}</td><td>${fmt(R.allM[k])}</td></tr>`).join('')}</tbody>
    </table></div>

    <div class="divider mt">IVR / GigaVoice</div>
    <div class="stats s5">
      ${stat('Портов IVR / потоков GV', R.ivr.ports)}
      ${stat('Дозвонов в час', R.ivr.dzH, 0, 'на все порты')}
      ${stat('Дозвонов в час', R.ivr.perPort, 1, 'на 1 порт')}
      ${stat('Разговоров в день', R.ivr.convD)}
      ${stat('Разговоров в месяц', R.ivr.convM)}
    </div>

    <div class="divider mt">Прозвон всего объёма</div>
    <div class="stats s3">
      ${stat('Время прозвона', R.total.hours, 1, '', 'ч')}
      ${stat('Рабочих дней', R.total.days, 1, `при ${fmt(e.hours, 1)} ч в день`, 'дн')}
      ${stat('Месяцев', R.total.months, 2, `при ${fmt(e.days)} раб. днях`, 'мес')}
    </div>`;
}

// ---------- Рендер ----------
function fieldHTML(e, f) {
  return `<div class="form-item${f.linked ? ' linked' : ''}">
    <label for="${e.id}-${f.k}">${f.linked ? '<span class="link-mark">⇄</span>' : ''}${f.label}</label>
    <div class="input-number"><input id="${e.id}-${f.k}" type="number" step="${f.step}" min="0" data-k="${f.k}" value="${e[f.k]}"><span class="addon">${f.addon}</span></div>
    ${f.extra ? `<div class="extra">${f.extra}</div>` : ''}
  </div>`;
}

function itemHTML(e) {
  return `<section class="card" data-id="${e.id}">
    <div class="card-head">
      <input class="title-input" data-k="name" value="${esc(e.name)}" title="Нажмите, чтобы переименовать">
      <div class="head-actions">
        <button class="btn btn-text" data-act="dup">Копировать</button>
        <button class="btn btn-text btn-danger" data-act="del">Удалить</button>
      </div>
    </div>
    <div class="card-body"><div class="grid">
      <div><div class="divider">Входные данные</div>${FIELDS.map(f => fieldHTML(e, f)).join('')}</div>
      <div><div class="divider">Расчёт</div><div class="res">${resultHTML(e)}</div></div>
    </div></div>
  </section>`;
}

function render() {
  $('list').innerHTML = state.items.length
    ? state.items.map(itemHTML).join('')
    : '<div class="card empty">Нет расчётов. Нажмите «Добавить расчёт».</div>';
  save();
}

// ---------- События ----------
$('list').addEventListener('input', ev => {
  const inp = ev.target.closest('[data-k]'); if (!inp) return;
  const card = inp.closest('.card'), e = byId(card.dataset.id), k = inp.dataset.k;
  if (k === 'name') { e.name = inp.value; save(); return; }

  e[k] = parseFloat(inp.value);
  const setField = (key, v) => { const el = card.querySelector(`[data-k="${key}"]`); if (el !== inp) el.value = v; };
  // Связка портов МИО ⇄ портов IVR: IVR = МИО × % дозвонов; сам % дозвонов связку не трогает
  if (k === 'mio' && isFinite(e.mio) && isFinite(e.dz)) { e.ivr = Math.round(e.mio * e.dz / 100); setField('ivr', e.ivr); }
  if (k === 'ivr' && isFinite(e.ivr) && e.dz > 0) { e.mio = Math.round(e.ivr / (e.dz / 100)); setField('mio', e.mio); }

  card.querySelector('.res').innerHTML = resultHTML(e);
  save();
});

document.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'add') {
    state.items.push(newItem(state.items.length + 1));
    render();
    $('list').lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const card = b.closest('.card'), e = card && byId(card.dataset.id); if (!e) return;
  if (act === 'dup') {
    const i = state.items.indexOf(e);
    state.items.splice(i + 1, 0, Object.assign({}, e, { id: uid(), name: e.name + ' (копия)' }));
    render();
  }
  if (act === 'del') {
    if (b.classList.contains('armed')) { state.items = state.items.filter(x => x !== e); render(); return; }
    b.classList.add('armed'); b.textContent = 'Точно удалить?';
    setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = 'Удалить'; } }, 3000);
  }
});

// ---------- Пароль (клиентская проверка по SHA-256) ----------
const PWD_HASH = 'd49d1dd9d499c93f3fc8f81482c0ff31b6de9120f34e56736bcfcfe1ab64cbdc';
const PWD_HASH_LAT = '290f47e21a6a55209b91ddace99acde68145aaa9ee80d68e69ebc41ba0b5d7f5'; // тот же пароль в английской раскладке
const SS_AUTH = 'load_calc_auth_v1';

async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
}
function unlock() {
  $('lock').hidden = true;
  $('app').hidden = false;
  render();
}
$('lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const h = await sha256($('pwd').value.trim().toLowerCase());
  if (h === PWD_HASH || h === PWD_HASH_LAT) {
    try { sessionStorage.setItem(SS_AUTH, PWD_HASH); } catch (err) { }
    unlock();
  } else {
    $('pwdErr').textContent = 'Неверный пароль';
    $('pwd').select();
  }
});

let authed = false;
try { authed = sessionStorage.getItem(SS_AUTH) === PWD_HASH; } catch (e) { }
if (authed) unlock();
</script>
</body>
</html>
